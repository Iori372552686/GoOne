name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  # 每个 job 的失败含义可区分：
  #   build-unit  — 编译 + vet + 全量单元测试（无中间件时集成测试自 Skip）
  #   race        — 并发敏感包的 -race 覆盖
  #   integration — 真实中间件下的集成用例（GOONE_INTEGRATION=1，用例数为 0 即失败）
  #   generated   — 生成代码两次生成无 diff
  #   security    — govulncheck 可达漏洞为 0 + gitleaks 凭据扫描
  #   lint        — golangci-lint（仅新问题）+ 静态 API 门禁 + 依赖图
  #   docs        — docs/ 全目录内部断链检查

  build-unit:
    name: Build & Unit Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build
        run: go build -mod=readonly ./...

      - name: Vet
        # composites disabled: generated gamedata repositories use unkeyed
        # Index2 literals (tracked in docs/optimization_roadmap.md 3.6).
        run: go vet -composites=false ./...

      - name: Test root packages
        run: go test -mod=readonly -count=1 -timeout 600s ./...

      - name: Build, vet and test library modules
        run: go run -mod=readonly ./tools/cmd/checkmodules check

      - name: Test optional etcd configuration
        env:
          GOFLAGS: -tags=config_etcd
        run: go run -mod=readonly ./tools/cmd/checkmodules test ./lib/contrib/config/factory

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Race (root packages)
        run: >
          go test -race -count=1 -timeout 600s
          ./module/gamedata/...
          ./src/mainsvr/role/...
          ./src/connsvr/...
          ./src/serviceconfig/...

      - name: Race (library modules)
        run: >
          go run ./tools/cmd/checkmodules race
          ./lib/net
          ./lib/service/runtime
          ./lib/service/router
          ./lib/service/svrinstmgr
          ./lib/service/bus
          ./lib/service/ssrpc
          ./lib/service/transaction
          ./lib/service/scheduler
          ./lib/service/async

  integration:
    # V4 P0-09：真实中间件集成。GOONE_INTEGRATION=1 时依赖不可达必须失败
    # （itest.Require 已改为 t.Fatal，不再静默 Skip）；用例数为 0 时 job 失败。
    name: Integration (mysql/redis/zk/rabbitmq)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=12
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181
        options: >-
          --health-cmd="echo ruok | nc 127.0.0.1 2181" --health-interval=10s --health-timeout=5s --health-retries=12
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: goone
          RABBITMQ_DEFAULT_PASS: ci-pass-${{ github.run_id }}
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOONE_INTEGRATION: "1"
      GOONE_AMQP_ADDR: amqp://goone:ci-pass-${{ github.run_id }}@127.0.0.1:5672/
      GOONE_MYSQL_DSN: root:ci-root-${{ github.run_id }}@tcp(127.0.0.1:3306)/testdb?charset=utf8
      GOONE_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Init MySQL testdb
        # GORM 集成测试 DSN 指向 testdb；CI mysql 镜像默认无该库，需先建。
        run: |
          for i in $(seq 1 30); do
            if mysqladmin -h127.0.0.1 -uroot -p"ci-root-${{ github.run_id }}" ping >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -p"ci-root-${{ github.run_id }}" -e "CREATE DATABASE IF NOT EXISTS testdb;"

      - name: Integration tests
        run: |
          set -o pipefail
          go run ./tools/cmd/checkmodules integration \
            ./lib/service/bus/driver/rabbitmq \
            ./lib/service/router \
            ./lib/service/svrinstmgr \
            ./lib/db/redis \
            ./lib/db/gorm \
            ./lib/contrib/registry/zookeeper \
            2>&1 | tee integration.log

      - name: Verify non-zero executed tests
        # V4 P0-09：用例数为 0 视为失败（避免依赖全 Skip 的虚假绿灯）。
        run: |
          ran=$(grep -cE '^=== RUN' integration.log || true)
          pass=$(grep -cE '^--- PASS' integration.log || true)
          echo "executed tests: $ran, passed: $pass"
          if [ "$ran" -eq 0 ]; then
            echo "integration job ran 0 tests — failing (all skipped or none matched)"
            exit 1
          fi

  generated:
    # V4 P0-09：生成代码两次生成无 diff（含 common/protocol，用 --full）。
    name: Generated Code (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate twice, expect no diff
        run: |
          set -e
          cp -R lib/contrib/protoc/protoc-33.2-linux-x86_64 "$RUNNER_TEMP/goone-protoc"
          chmod +x "$RUNNER_TEMP/goone-protoc/bin/protoc"
          export PROTOC_BIN_DIR="$RUNNER_TEMP/goone-protoc"
          export PATH="$PROTOC_BIN_DIR/bin:$PATH"
          for pass in 1 2; do
            bash ./main.sh check-genproto --full
            git diff --exit-code -- api/gen
            git -C common diff --exit-code -- protocol
          done

  security:
    # 供应链与凭据门禁。govulncheck 可达漏洞为 0；gitleaks 阻止真实凭据进入 diff。
    # 工具版本固定以保证可复现：govulncheck v1.10.0、gitleaks v8.30.1。
    name: Security (govulncheck + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: govulncheck
        # 可达漏洞必须为 0；任一可达漏洞阻断合并。
        run: |
          set -e
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
          go run ./tools/cmd/checkmodules security

      - name: gitleaks
        # 扫描全部历史与工作区，禁止 Token、完整 DSN、Authorization、私钥进入仓库。
        # 配置见仓库根 .gitleaks.toml（allowRules 仅放行 .env.example 中的 change-me 占位）。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v8.30.1

  lint:
    name: golangci-lint + static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - uses: golangci/golangci-lint-action@v8
        with:
          # 固定版本，避免浮动 latest 导致门禁不可复现。
          version: v2.14.0
          # 只对本次改动引入的新问题失败；存量债务冻结在 origin/dev 基线。
          args: --new-from-rev=origin/${{ github.base_ref || 'dev' }}

      - name: Legacy lifecycle static scan
        # 已删除旧生命周期；此扫描阻止 application/bootstrap/busapp 旧 API
        # 被重新引入生产代码（cmd/src/lib/tools，排除注释与生成代码）。
        run: |
          set -e
          hits=$(grep -rnE "application\.(Init|Run)|NewServiceApp|bootstrap\.ServiceApp" \
            cmd src lib tools 2>/dev/null \
            | grep -v "_test.go" \
            | grep -vE "^\s*//|^\s*\*" \
            | grep -v "api/gen/" \
            || true)
          if [ -n "$hits" ]; then
            echo "Found references to removed legacy lifecycle APIs:"
            echo "$hits"
            exit 1
          fi

      - name: Legacy SSRPC register API scan
        # 生产服务必须经 RegistryComponent + RegisterToRegistry，禁止再
        # 调用 RegisterToDispatcher / RegisterToTransactionMgr / TransMgr.RegisterCmd
        #（生成代码、测试与兼容实现不在扫描范围）。
        run: |
          set -e
          hits=$(grep -rnE "Register[A-Za-z]+ToDispatcher|Register[A-Za-z]+ToTransactionMgr|TransMgr\.RegisterCmd" \
            cmd src 2>/dev/null \
            | grep -v "_test.go" \
            | grep -vE "^\s*//|^\s*\*" \
            | grep -v "api/gen/" \
            || true)
          if [ -n "$hits" ]; then
            echo "Found legacy SSRPC register API usage in production (cmd/src):"
            echo "$hits"
            exit 1
          fi

      - name: Bus driver/all blank-import scan
        # driver/all 的 blank import 不允许出现在 cmd/src/lib/service/runtime
        #（生产 bus 服务必须显式 DriverRegistry+MustRegister；websvr 不导入任何 driver）。
        # driver/all 包本身与各 driver 的 init 注册保留为兼容路径，由本扫描排除。
        run: |
          set -e
          hits=$(grep -rnE '"[^"]*bus/driver/all"' \
            cmd src lib/service/runtime 2>/dev/null \
            | grep -v "_test.go" \
            | grep -vE "^\s*//|^\s*\*" \
            || true)
          if [ -n "$hits" ]; then
            echo "Found driver/all blank import in production (cmd/src/lib/service/runtime):"
            echo "$hits"
            exit 1
          fi

      - name: Binary dependency graph gate
        # websvr 不得链接任何 MQ SDK；bus 服务（connsvr 代表）只
        # 链接 rabbitmq（amqp091-go），不链接 rocketmq/nats/nsq/kafka；streadway/amqp
        # 不得出现在模块图。
        run: |
          set -e
          web_deps=$(go list -deps ./cmd/web_svr)
          gateway_deps=$(go list -deps ./cmd/connsvr)
          all_modules=$(go list -m all)
          if grep -Eq 'amqp091-go|rocketmq|nats.go|go-nsq|kafka-go' <<< "$web_deps"; then
            echo "websvr unexpectedly links MQ SDK"; exit 1
          fi
          if grep -Eq 'rocketmq|nats.go|go-nsq|kafka-go' <<< "$gateway_deps"; then
            echo "connsvr links unselected MQ SDK"; exit 1
          fi
          if grep -q 'streadway/amqp' <<< "$all_modules"; then
            echo "streadway/amqp still in module graph"; exit 1
          fi

  docs:
    # V4 P0-09：docs/ 全目录内部断链检查（取代仅扫描 README/CHANGELOG 的旧逻辑）。
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Check docs links
        run: go run ./tools/cmd/checkdocs ./docs
