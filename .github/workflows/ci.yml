name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        # composites disabled: generated gamedata repositories use unkeyed
        # Index2 literals (tracked in docs/optimization_roadmap.md 3.6).
        run: go vet -composites=false ./...

      - name: Test
        # Integration tests self-skip when local middleware (redis/consul/
        # zookeeper/nacos/mysql) is unavailable.
        # Excluded for now (tracked in docs/optimization_roadmap.md):
        #   - tools/cfgtool/test: fixture xlsx incompatible with parser
        #   - tools/tester: end-to-end client that dials a remote dev server
        run: >
          go test -count=1 -timeout 600s
          ./lib/... ./src/... ./common/... ./module/...
          ./tools/protoc-gen-goone/... ./tools/cmd/...

      - name: Race (core packages)
        # 包含 P0 迭代新增的生命周期/配置/调度/bus 注册表等并发敏感包。
        run: >
          go test -race -count=1 -timeout 300s
          ./lib/net/...
          ./lib/service/transaction/...
          ./lib/service/router/...
          ./lib/service/ssrpc/...
          ./lib/service/runtime/...
          ./lib/service/appconfig/...
          ./lib/service/scheduler/...
          ./lib/service/bus/...
          ./lib/util/safego/...
          ./lib/util/bufpool/...

  check-genproto:
    name: Check generated proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: check-genproto
        run: ./main.sh check-genproto

  lint:
    name: golangci-lint (new issues only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # 只对本次改动引入的新问题失败；存量债务冻结在 origin/dev 基线。
          args: --new-from-rev=origin/${{ github.base_ref || 'dev' }}

      - name: Legacy lifecycle static scan
        # P0-09 已删除旧生命周期；此扫描阻止 application/bootstrap/busapp 旧 API
        # 被重新引入生产代码（cmd/src/lib/tools，排除注释与生成代码）。
        run: |
          set -e
          hits=$(grep -rnE "application\.(Init|Run)|NewServiceApp|bootstrap\.ServiceApp" \
            cmd src lib tools 2>/dev/null \
            | grep -v "_test.go" \
            | grep -vE "^\s*//|^\s*\*" \
            | grep -v "api/gen/" \
            || true)
          if [ -n "$hits" ]; then
            echo "Found references to removed legacy lifecycle APIs:"
            echo "$hits"
            exit 1
          fi

      - name: Legacy SSRPC register API scan
        # 方案 B P1-03：生产服务必须经 RegistryComponent + RegisterToRegistry，禁止再
        # 调用 RegisterToDispatcher / RegisterToTransactionMgr / TransMgr.RegisterCmd
        #（生成代码、测试与兼容实现不在扫描范围）。
        run: |
          set -e
          hits=$(grep -rnE "Register[A-Za-z]+ToDispatcher|Register[A-Za-z]+ToTransactionMgr|TransMgr\.RegisterCmd" \
            cmd src 2>/dev/null \
            | grep -v "_test.go" \
            | grep -vE "^\s*//|^\s*\*" \
            | grep -v "api/gen/" \
            || true)
          if [ -n "$hits" ]; then
            echo "Found legacy SSRPC register API usage in production (cmd/src):"
            echo "$hits"
            exit 1
          fi

      - name: Bus driver/all blank-import scan
        # 方案 B P1-04：driver/all 的 blank import 不允许出现在 cmd/src/lib/service/runtime
        #（生产 bus 服务必须显式 DriverRegistry+MustRegister；websvr 不导入任何 driver）。
        # driver/all 包本身与各 driver 的 init 注册保留为兼容路径，由本扫描排除。
        run: |
          set -e
          hits=$(grep -rnE '"[^"]*bus/driver/all"' \
            cmd src lib/service/runtime 2>/dev/null \
            | grep -v "_test.go" \
            | grep -vE "^\s*//|^\s*\*" \
            || true)
          if [ -n "$hits" ]; then
            echo "Found driver/all blank import in production (cmd/src/lib/service/runtime):"
            echo "$hits"
            exit 1
          fi

      - name: Binary dependency graph gate
        # 方案 B P1-04/P1-05：websvr 不得链接任何 MQ SDK；bus 服务（connsvr 代表）只
        # 链接 rabbitmq（amqp091-go），不链接 rocketmq/nats/nsq/kafka；streadway/amqp
        # 不得出现在模块图。
        run: |
          set -e
          if go list -deps ./cmd/web_svr 2>/dev/null | grep -Eq 'rocketmq|nats.go|go-nsq|kafka-go'; then
            echo "websvr unexpectedly links MQ SDK"; exit 1
          fi
          if go list -deps ./cmd/connsvr 2>/dev/null | grep -Eq 'rocketmq|nats.go|go-nsq|kafka-go'; then
            echo "connsvr links unselected MQ SDK"; exit 1
          fi
          if go list -m all 2>/dev/null | grep -q 'streadway/amqp'; then
            echo "streadway/amqp still in module graph"; exit 1
          fi

      - name: Docs link check
        # 校验 README/CHANGELOG 引用的 docs/ 路径确实存在。
        run: |
          set -e
          missing=0
          for link in $(grep -oE "docs/[A-Za-z0-9_./-]+\.md" readme.md CHANGELOG.md 2>/dev/null | sort -u); do
            if [ ! -f "$link" ]; then
              echo "broken doc link: $link"
              missing=1
            fi
          done
          exit $missing
