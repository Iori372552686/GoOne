# GoOne 服务配置（分组写法：base_cfg + 各服务段）。
# 加载与读取由 module/conf 统一负责：支持 yaml/toml/json，按 -svr_conf 指定的
# 文件后缀自动选 decoder；业务代码用 conf.Get("connsvr.runtime.listen_port")
# 或 conf.Unmarshal("base_cfg.dependencies.db_instances", &dbs) 读取。
base_cfg:
  runtime:
    env_mode: dev
    register_addr: 'etcd://43.139.3.228:12379?service=online&timeout=5s&namespace=/GoOneServices'
    bus_mq_addr: 'amqp://guest:guest@43.139.3.228:15672/'
    admin_server:
      enabled: true
      ip: ""
      port: 0
    tracing:
      enabled: false
      exporter: stdout
      endpoint: ""
      insecure: false
      sampler_ratio: 1

  dependencies:
    game_data_dir: ./common/game_data
    sensitive_words_file: ./common/sensitive/sensitive.txt

    http_sign:
      - index_name: default
        private_key: d1233f2b7e9885ffb8a8268d06f44c6e2
        sign_name: sign
        expired_time: 1800
        timestamp_name: timestamp
        sign_type: md5
        request_id_name: ''

    db_instances:
      - instance_id: 1
        ip: 43.139.3.228
        port: 6379
        password: go123456
        is_cluster: false
        description: role info data
      - instance_id: 3
        ip: 43.139.3.228
        port: 6379
        password: go123456
        is_cluster: false
        description: brief info data

    orm_instances:
      - index_name: default
        master:
          ip: 43.139.3.228
          port: 3306
          user: g1_game
          password: go123456
          db_name: g1_game
        slaves: []
        description: test db1
        max_idle: 10
        max_open: 200
        show_sql: true
        init_flag: true
        drive_name: mysql

    rest_api_config:
      - service_name: default
        urls:
          - 'http://43.139.3.228:8000/mg/api/sdk/getGameRole?'
        sign_name: default

    nacos_conf:
      ip_addr:
      port: 8848
      namespace_id: b3870fb7-1ed0-4764-937f-0071ed2e1cc4
      group_name: poker_gameconf
      user_name: poker
      password: poker123
      log_dir: \tmp\nacos\log
      cache_dir: \tmp\nacos\cache
      rotate_time: 1h
      max_age: 3
      log_level: debug

  debug:
    pprof: true

connsvr:
  identity:
    self_bus_id: 2.1.1.251
  runtime:
    listen_port: 11000
    game_id: GoOne
  debug:
    log_dir: ./logs/
    log_level: debug
  # 过载保护参数（可选；缺省 0 = 不限制，向后兼容）。需要限流时取消注释：
  # capacity:
  #   max_connections: 0                  # 总连接上限，0 = 不限
  #   max_unauthenticated_connections: 0  # 未认证连接上限，0 = 不限
  #   connection_rate: 0                  # 每秒新建连接，0 = 不限
  #   login_rate: 0                       # 每秒登录(BindClient)，0 = 不限
  #   max_inflight: 0                     # 全局在途 SSRPC，0 = 不限
  #   overload_mode: off                  # off / shadow / enforce

infosvr:
  identity:
    self_bus_id: 2.1.3.251
  debug:
    log_dir: ../logs
    log_level: debug
  # 简报缓存 TTL（天）。0=永不过期（现状兼容）；过期后由 mainsvr 心跳回填。
  capacity:
    brief_cache_ttl_days: 7

mainsvr:
  identity:
    self_bus_id: 2.1.2.251
  debug:
    log_dir: ../logs
    log_level: debug
  # capacity 说明（角色 DAL 三层持久化）：
  #   role_cache_ttl_days        L2 角色缓存 TTL（天）。0=永不过期（现状兼容）；
  #                              30 = 30 天滑动过期，前提是 L3 快照已启用（已默认启用）。
  #   role_l3_flush_debounce_sec L3 全量快照写回防抖（秒），默认 60；控制 MySQL 写放大。
  capacity:
    role_cache_ttl_days: 30
    role_l3_flush_debounce_sec: 60

mysqlsvr:
  identity:
    self_bus_id: 2.1.4.251
  debug:
    log_dir: ../logs
    log_level: debug
  # role_data 分表数。1 = 不分表（表名 role_data 无后缀）；
  # >1 = 启动时自动建 role_data_N 分表并把基表数据迁入（基表改名 role_data__legacy）。
  # 公式 fnv32a(uid)%N 一经启用即为契约，扩容需数据迁移。
  capacity:
    role_table_shards: 1

websvr:
  identity:
    self_bus_id: 2.1.12.251
  debug:
    log_dir: ../logs
    log_level: debug
  runtime:
    http_server:
      port: 10001
      session_name: GoOne@Gin.Seeeion
      mode: debug
      auth_enable: false
    grpc_server:
      enabled: true
      ip: ""
      port: 10002
      reflection: true


roomcentersvr:
  identity:
    self_bus_id: 2.1.11.251
  debug:
    log_dir: ../logs
    log_level: debug
