# GoOne 服务配置（分组写法：base_cfg + 各服务段）。
# 加载与读取由 module/conf 统一负责：支持 yaml/toml/json，按 -svr_conf 指定的
# 文件后缀自动选 decoder；业务代码用 conf.Get("connsvr.runtime.listen_port")
# 或 conf.Unmarshal("base_cfg.dependencies.db_instances", &dbs) 读取。
base_cfg:
  runtime:
    register_addr: 'etcd://43.139.3.228:12379?service=online&timeout=5s&namespace=/GoOneServices'
    bus_mq_addr: 'amqp://guest:guest@43.139.3.228:15672/'
    admin_server:
      enabled: true
      ip: ""
      port: 0
    tracing:
      enabled: false
      exporter: stdout
      endpoint: ""
      insecure: false
      sampler_ratio: 1

  dependencies:
    game_data_dir: ./common/game_data
    sensitive_words_file: ./common/sensitive/sensitive.txt

    http_sign:
      - index_name: default
        private_key: d1233f2b7e9885ffb8a8268d06f44c6e2
        sign_name: sign
        expired_time: 1800
        timestamp_name: timestamp
        sign_type: md5
        request_id_name: ''

    db_instances:
      - instance_id: 1
        ip: 43.139.3.228
        port: 6379
        password: go123456
        is_cluster: false
        description: role info data
      - instance_id: 3
        ip: 43.139.3.228
        port: 6379
        password: go123456
        is_cluster: false
        description: brief info data
      - instance_id: 10
        ip: 43.139.3.228
        port: 6379
        password: go123456
        is_cluster: false
        description: texas room snapshot data

    orm_instances:
      - index_name: default
        master:
          ip: 43.139.3.228
          port: 3306
          user: g1_game
          password: go123456
          db_name: g1_game
        slaves: []
        description: test db1
        max_idle: 10
        max_open: 200
        show_sql: true
        init_flag: true
        drive_name: mysql

    rest_api_config:
      - service_name: default
        urls:
          - 'http://43.139.3.228:8000/mg/api/sdk/getGameRole?'
        sign_name: default

    nacos_conf:
      ip_addr:
      port: 8848
      namespace_id: b3870fb7-1ed0-4764-937f-0071ed2e1cc4
      group_name: poker_gameconf
      user_name: poker
      password: poker123
      log_dir: \tmp\nacos\log
      cache_dir: \tmp\nacos\cache
      rotate_time: 1h
      max_age: 3
      log_level: debug

  debug:
    pprof: true

connsvr:
  identity:
    self_bus_id: 2.1.1.251
  runtime:
    listen_port: 11000
  debug:
    log_dir: ./logs/
    log_level: debug

infosvr:
  identity:
    self_bus_id: 2.1.3.251
  debug:
    log_dir: ../logs
    log_level: debug

mainsvr:
  identity:
    self_bus_id: 2.1.2.251
  debug:
    log_dir: ../logs
    log_level: debug

mysqlsvr:
  identity:
    self_bus_id: 2.1.4.251
  debug:
    log_dir: ../logs
    log_level: debug

websvr:
  identity:
    self_bus_id: 2.1.12.251
  debug:
    log_dir: ../logs
    log_level: debug
  runtime:
    http_server:
      port: 10001
      session_name: GoOne@Gin.Seeeion
      mode: debug
      auth_enable: false
    grpc_server:
      enabled: true
      ip: ""
      port: 10002
      reflection: true

roomcentersvr:
  identity:
    self_bus_id: 2.1.11.251
  debug:
    log_dir: ../logs
    log_level: debug

