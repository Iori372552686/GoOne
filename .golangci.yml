version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - misspell
    - unused
    - forbidigo
  settings:
    govet:
      disable:
        # generated gamedata repositories use unkeyed Index2 composite
        # literals; re-enable once the cfgtool generator emits keyed fields.
        - composites
    errcheck:
      # legacy code ignores many non-critical errors; start with the most
      # dangerous ones and tighten gradually.
      check-type-assertions: false
      check-blank: false
    forbidigo:
      # 禁止 ssrpc handler 直接写 rsp.Ret.Code = —— 应改用 return rsp, gerr.New(...)
      # 框架 WrapUnary 会自动把 gerr 错误码写进 Ret.Code 并回包。
      # 辅助函数（room/create.go, room/join.go, roomcentersvr/logic）仍允许，
      # 它们返回 *Rsp 而非 (rsp, error)，不直接对接框架 error 回包机制。
      forbid:
        - '\.Ret\.Code\s*='
      exclude-godoc-examples: true

issues:
  # Freeze legacy debt: only lint findings introduced by new changes fail CI.
  # Run `golangci-lint run --new-from-rev=origin/dev` locally for the same view.
  max-issues-per-linter: 0
  max-same-issues: 0

exclusions:
  generated: lax
  paths:
    - api/gen
    - game_protocol/protocol
    - common/gamedata/repository
    # 辅助函数返回 *Rsp（非 ssrpc handler），保留 rsp.Ret.Code 写法
    - src/mainsvr/room/create\.go
    - src/mainsvr/room/join\.go
    - src/roomcentersvr/logic
